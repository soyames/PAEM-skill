name: Persistent AI Execution Manager
id: paem-skill
version: 1.3.0
author: Yao Amevi Amessinou Sossou
license: MIT
homepage: https://github.com/soyames/PAEM-skill
description: >
  An AI orchestration skill for long-running software engineering projects that
  must survive interruptions. It publishes validated, repository-bound
  checkpoints, preserves project memory, and prepares recovery instructions with
  explicit verification and staleness status. Applies to hourly rate limits,
  daily quotas, context exhaustion, browser crashes, network failures, and
  machine restarts - bounded by the last checkpoint that was actually written,
  since nothing can recover work that was never saved.

category:
  - software-engineering
  - workflow
  - orchestration
  - automation
  - recovery

keywords:
  - checkpoint
  - resume
  - recovery
  - engineering
  - codex
  - claude
  - gemini
  - cursor
  - ai
  - context
  - orchestration
  - rate-limit
  - persistent
  - multi-session
  - agent

entry: paem.md
skill_entry: SKILL.md

supports:
  - Claude
  - Codex
  - ChatGPT
  - Gemini
  - Cursor
  - Antigravity
  - OpenHands
  - Aider
  - Continue
  - Grok
  - Local LLMs

runtime:
  state_dir: .paem
  requires:
    - filesystem read/write
    - ability to follow multi-step instructions
  optional:
    - Python 3.11+ (enables the validated checkpoint writer, initializer and staleness check)
    - git
    - A-G-E-N-T-S.md (repo-wide agent conventions, cross-tool standard)
    - optional Stop-hook guard (Claude Code verified; Codex CLI and Gemini CLI documented; Cursor best-effort) - a best-effort, fail-open check, not a guarantee
    - .paem/provider_budgets.md (user-defined soft time thresholds; no provider exposes real quota)

language: en
