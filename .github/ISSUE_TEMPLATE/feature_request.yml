name: Feature request
description: Propose an improvement to the protocol, templates, prompts, or docs.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first, then the idea. Prefer small, additive changes to the portable protocol.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What friction or failure does this address?
      placeholder: When switching from Claude to Gemini, resume prompts are too long to paste...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should we add or change in this repo?
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Protocol impact
      options:
        - Docs / examples only
        - Prompts only
        - Additive template fields (backward compatible)
        - Breaking schema / workflow change
        - Unsure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered (optional)
  - type: checkboxes
    id: confirms
    attributes:
      label: Confirmations
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I am willing to open a PR if maintainers agree (optional)
          required: false
